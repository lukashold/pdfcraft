[package]
name = "tauri-plugin-pdf-export"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false
links = "tauri-plugin-pdf-export"

[dependencies]
tauri = { version = "=2.12.3", default-features = false }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "=2.7.1", features = ["build"] }

[lints.rust]
unsafe_code = "forbid"
