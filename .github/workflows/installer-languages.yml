name: Installer languages
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/installer-languages.yml'
  push:
    branches: [main, codex/installer-languages]
    paths:
      - 'packaging/**'
      - '.github/workflows/installer-languages.yml'
permissions:
  contents: read
jobs:
  windows:
    name: Offline Setup and MSI (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned WiX build tool
        run: dotnet tool install --global wix --version 5.0.2
      - name: Catalog parity and codepages
        run: python packaging/test-installer-languages.py
      - name: Build and inspect all installer languages (no installation)
        shell: pwsh
        run: ./packaging/windows/test-language-build.ps1 -Arch ${{ matrix.arch }} -Work "$env:RUNNER_TEMP/installer-language-fixture"
  windows-native-ui:
    name: Native MSI Unicode dialogs (Hindi, Bengali, Urdu)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned WiX build tool
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build inert MSI preview fixture (no installation)
        shell: pwsh
        run: ./packaging/windows/test-language-build.ps1 -Arch x64 -Work "$env:RUNNER_TEMP/native-language-fixture"
      - name: Inspect actual native dialog controls (no installation)
        shell: pwsh
        run: |
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -MTA -File ./packaging/windows/test-native-dialogs.ps1 -Msi "$env:RUNNER_TEMP/native-language-fixture/out/PdfCraft.msi" -Work "$env:RUNNER_TEMP/native-dialog-results"
          if ($LASTEXITCODE -ne 0) { throw 'Native MSI UI qualification failed; inspect the text report. No visual pass is claimed.' }
      - name: Retain native control-text evidence (no screenshots or payloads)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-msi-unicode-dialog-results
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/native-dialog-results/*.json
            ${{ runner.temp }}/native-dialog-results/*.log
  macos:
    name: Native localized PKG
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Catalog parity and codepages
        run: python3 packaging/test-installer-languages.py
      - name: Build PKG and inspect native locale resolution (no installation)
        run: bash packaging/macos/test-localized-pkg.sh "$RUNNER_TEMP/installer-language-fixture"
