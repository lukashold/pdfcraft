name: Mobile packages

on:
  workflow_dispatch:
  push:
    branches: [codex/mobile-apps, codex/mobile-touch-preview]
  pull_request:
    paths:
      - packaging/mobile/**
      - apps/pdfcraft-web/**
      - crates/ui-egui/src/host_files.rs
      - .github/workflows/mobile.yml
      - xtask/src/mobile.rs
      - xtask/src/mobile_android_notices.rs
      - xtask/Cargo.toml
      - Cargo.lock

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 3
  PDFCRAFT_SYSTEM_FONTS: "0"
  CRAFT_FONTS_REQUIRED: "1"

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-dependency-audit
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Enforce the repository license/advisory policy on both mobile targets
        # cargo-deny 0.20.2 automatically loads deny.exceptions.toml from the
        # selected standalone workspace; --config retains the root policy.
        run: |
          cargo deny --manifest-path packaging/mobile/app/Cargo.toml --config deny.toml --locked --target aarch64-linux-android check
          cargo deny --manifest-path packaging/mobile/app/Cargo.toml --config deny.toml --locked --target aarch64-apple-ios check

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: storytold/craft-fonts
          ref: 8dcdacd5153e64560d109541a47d806f26f048c0
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-web
      - name: Native UI test dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libdbus-1-dev
      - name: Pinned Rust web bundler
        run: cargo install trunk --version 0.21.14 --locked
      - name: Format, file-dialog regressions, all UI languages and assets
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p pdfcraft-ui-egui --lib host_files::tests
          cargo test --locked -p pdfcraft-ui-egui --lib i18n::
          cargo test --locked -p pdfcraft-ui-egui --lib touch::
          cargo test --locked -p pdfcraft-ui-egui --test touch_controls --test touch_header --test touch_phone
          cargo test --locked -p xtask mobile::
          cargo xtask assets
          cargo xtask layers
          cargo xtask parity
      - name: Build bundled offline frontend
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: |
          if [ "$GITHUB_REPOSITORY" = "storytold/pdfcraft" ]; then
            cargo xtask mobile frontend
          else
            cargo xtask mobile frontend-preview
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-frontend
          path: dist/mobile
          if-no-files-found: error
          retention-days: 14

  android:
    needs: [frontend, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mobile-frontend
          path: dist/mobile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;29.0.14206865'
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            packaging/mobile/app -> target
          key: mobile-android
      - name: Install the pinned native host CLI
        run: cargo install tauri-cli --version 2.12.2 --locked
      - name: Generate native project and build installable debug APKs
        run: |
          cargo xtask mobile prepare android
          cargo xtask mobile android
      - uses: actions/upload-artifact@v4
        with:
          name: PdfCraft-Android-debug
          path: |
            packaging/mobile/app/gen/android/app/build/outputs/apk/**/*.apk
            packaging/mobile/NOTICE.txt
            packaging/mobile/LICENSE-MPL-2.0.txt
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: [frontend, dependencies]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mobile-frontend
          path: dist/mobile
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            packaging/mobile/app -> target
          key: mobile-ios
      - name: Install Xcode project generator and pinned Rust host CLI
        run: |
          brew install xcodegen
          cargo install tauri-cli --version 2.12.2 --locked
      - name: Host tests and strict lint
        run: |
          cargo fmt --manifest-path packaging/mobile/app/Cargo.toml -- --check
          cargo test --locked --manifest-path packaging/mobile/app/Cargo.toml
          cargo clippy --locked --manifest-path packaging/mobile/app/Cargo.toml --all-targets -- -D warnings
      - name: Build iPad/iPhone simulator application without signing secrets
        run: |
          cargo xtask mobile prepare ios
          cargo xtask mobile ios-simulator
      - name: Archive simulator bundles preserving their structure
        run: |
          find packaging/mobile/app/gen/apple/build -type d -name '*.app' -prune -exec ditto -c -k --sequesterRsrc --keepParent '{}' '{}.zip' \;
      - uses: actions/upload-artifact@v4
        with:
          name: PdfCraft-iOS-simulator
          path: |
            packaging/mobile/app/gen/apple/build/**/*.app.zip
            packaging/mobile/NOTICE.txt
            packaging/mobile/LICENSE-MPL-2.0.txt
          if-no-files-found: error
          retention-days: 14
